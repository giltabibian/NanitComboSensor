" y="327.4263">ALS_RDY = 1</text><polygon fill="#A80036" points="780,370.625,770,374.625,780,378.625,776,374.625" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="774" x2="998" y1="374.625" y2="374.625"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="58" x="786" y="369.5591">INT pulse</text><polygon fill="#A80036" points="987,399.7578,997,403.7578,987,407.7578,991,403.7578" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="769" x2="993" y1="403.7578" y2="403.7578"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="206" x="776" y="398.6919">read STATUS (clears + re-arms)</text><polygon fill="#A80036" points="374,444.0234,364,448.0234,374,452.0234,370,448.0234" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="368" x2="763" y1="448.0234" y2="448.0234"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="167" x="380" y="427.8247">ALS_RDY &amp;&amp; buffer_en -&gt;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="123" x="380" y="442.9575">iio_trigger_poll(trig)</text><line style="stroke: #A80036; stroke-width: 1.0;" x1="363" x2="405" y1="492.2891" y2="492.2891"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="405" x2="405" y1="492.2891" y2="505.2891"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="364" x2="405" y1="505.2891" y2="505.2891"/><polygon fill="#A80036" points="374,501.2891,364,505.2891,374,509.2891,370,505.2891" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="105" x="370" y="472.0903">pollfunc top half:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="