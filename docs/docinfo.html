  position: fixed;
  top: 0.6rem;
  left: 0.8rem;
  z-index: 1000;
  margin: 0;
  font-size: 0.9em;
}
.back-to-index a {
  background: rgba(255, 255, 255, 0.85);
  padding: 0.15rem 0.4rem;
  border-radius: 0.25rem;
}
@media screen and (max-width: 992px) {
  .back-to-index {
    position: static;
    margin-bottom: 1rem;
  }
  .back-to-index a { background: none; padding: 0; }
}
</style>
