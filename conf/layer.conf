# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-nanit-envcombo"
BBFILE_PATTERN_meta-nanit-envcombo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-nanit-envcombo = "6"

LAYERDEPENDS_meta-nanit-envcombo = "core"
LAYERSERIES_COMPAT_meta-nanit-envcombo = "scarthgap"
